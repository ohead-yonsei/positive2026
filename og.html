<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>긍정의밤 2026 미리보기 이미지</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{background:#FF9F45 radial-gradient(rgba(26,18,38,.12) 2px,transparent 2.2px) 0 0/30px 30px;font-family:"Jua",sans-serif;color:#1A1226}
.card{position:absolute;inset:0;display:grid;grid-template-columns:44% 56%;align-items:center;padding:0 5vw;box-sizing:border-box}
.logo{width:100%;transform:rotate(-5deg);filter:drop-shadow(1vw 1.2vw 0 #1A1226)}
.txt{padding-left:4vw}
.inv{font-family:"Permanent Marker",cursive;font-size:3.6vw;margin:0;transform:rotate(-3deg)}
h1{font-weight:400;white-space:nowrap;font-size:7vw;line-height:1;margin:1.5vw 0 0;color:#FFF7EA;-webkit-text-stroke:.35vw #1A1226;paint-order:stroke fill;text-shadow:.8vw .9vw 0 #1A1226}
.meta{display:inline-block;margin-top:3vw;background:#FFF7EA;border:.45vw solid #1A1226;border-radius:2vw;padding:1.4vw 2.4vw 1vw;font-size:3vw;white-space:nowrap;line-height:1.35;box-shadow:.8vw .8vw 0 #1A1226;transform:rotate(-1deg)}
.meta small{display:block;font-size:2.3vw;color:#6B5A72}
.ed{display:inline-block;margin-top:2.6vw;font-family:"Permanent Marker",cursive;font-size:2.8vw;background:#FF6A00;border:.45vw solid #1A1226;border-radius:99vw;padding:.6vw 2.4vw .3vw;transform:rotate(3deg);box-shadow:.6vw .6vw 0 #1A1226}
.ghost{position:absolute;right:3vw;bottom:2vw;width:9vw;transform:rotate(8deg)}
.boo{position:absolute;right:3vw;bottom:13vw;font-family:"Permanent Marker",cursive;font-size:3vw;background:#FFF7EA;border:.4vw solid #1A1226;border-radius:1.6vw;padding:.4vw 1.4vw .1vw;transform:rotate(-8deg);box-shadow:.5vw .5vw 0 #1A1226}
</style>
</head>
<body>
<div class="card">
  <img class="logo" id="logo" alt="">
  <div class="txt">
    <p class="inv">You’re invited!</p>
    <h1>긍정의밤 2026</h1>
    <div class="meta">10.31 토 – 11.1 일<small>돌기와토담집 · BBQ 파티 + 할로윈 밤</small></div><br>
    <span class="ed">Halloween edition</span>
  </div>
</div>
<span class="boo">Boo!</span>
<svg class="ghost" viewBox="0 0 100 124"><path d="M16 62C16 27 33 8 50 8s34 19 34 54v46c-6-6-11-6-16 0-5 6-10 6-14 0-5-6-10-6-14 0-4 6-9 6-14 0-5-6-10-6-10 0Z" fill="#FFF7EA" stroke="#1A1226" stroke-width="5" stroke-linejoin="round"/><path d="M16 70c-7 2-12 0-13-5M84 70c7 2 12 0 13-5" fill="none" stroke="#1A1226" stroke-width="5" stroke-linecap="round"/><ellipse cx="38" cy="54" rx="5" ry="7" fill="#1A1226"/><ellipse cx="62" cy="54" rx="5" ry="7" fill="#1A1226"/><circle cx="40" cy="51" r="1.8" fill="#fff"/><circle cx="64" cy="51" r="1.8" fill="#fff"/><ellipse cx="29" cy="66" rx="6" ry="3.5" fill="#FF9EB5"/><ellipse cx="71" cy="66" rx="6" ry="3.5" fill="#FF9EB5"/><ellipse cx="50" cy="68" rx="4" ry="5" fill="#1A1226"/></svg>
<script>
fetch('index.html').then(r=>r.text()).then(t=>{const m=t.match(/src="(data:image\/webp;base64,[^"]+)"/);if(m)document.getElementById('logo').src=m[1]});
</script>
</body>
</html>
